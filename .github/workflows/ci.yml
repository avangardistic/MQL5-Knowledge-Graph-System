name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run the test suite
        run: python -m pytest -v

      - name: CLI smoke test (index and query)
        run: |
          mql5kg index sample_mql5 -o /tmp/graph.json --json
          mql5kg status /tmp/graph.json --json
          mql5kg trace /tmp/graph.json OnTick OrderSend

      # Guard against silent content drift: every file under the guarded
      # content trees (test fixtures, docs, sample sources) must exist on disk
      # AND be tracked by git. This prevents the failure mode where a
      # '.gitignore' rule or a missing `git add` silently drops a required file
      # (for example the old '*.log' rule swallowing
      # tests/fixtures/compiler_logs/*.log), which only surfaces as a missing
      # file on a fresh clone. Add new content trees to GUARDED as needed.
      - name: Guard against untracked content files
        run: |
          python - <<'PY'
          import pathlib, subprocess

          # A file is only usable in CI if it is committed. If a rule in
          # .gitignore swallows it (e.g. the old *.log rule hiding
          # tests/fixtures/compiler_logs/*.log) it is present on disk locally
          # but absent from `git ls-files`, surfacing as a missing file on a
          # fresh clone. Guard whole trees: every file under each guarded tree
          # must exist on disk AND be tracked by git.
          root = pathlib.Path(".")
          guarded = ["tests/fixtures", "docs", "sample_mql5"]
          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          tracked_set = set(tracked)
          problems = []
          total = 0
          for tree in guarded:
              tree_path = root / tree
              if not tree_path.is_dir():
                  raise SystemExit(f"guarded tree {tree} is missing")
              for f in sorted(tree_path.rglob("*")):
                  if not f.is_file():
                      continue
                  total += 1
                  norm = f.as_posix()
                  if norm not in tracked_set:
                      problems.append(f"UNTRACKED  {norm}  (add to git or fix .gitignore)")

          if problems:
              print("::error::Committing these required content files:")
              for msg in problems:
                  print(f"::error::  {msg}")
              raise SystemExit(1)
          print(f"verified {total} files in {', '.join(guarded)} are tracked and not ignored")
          PY

      # Guard: reject committed private keys and placeholder secrets. The scan
      # is best-effort and never fails the build on documentation words such as
      # "token" or "key".
      - name: Verify no private secrets in tracked files
        run: |
          ! grep -Rni --binary-files=without-match \
            -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/v/cache/lastfailed