[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mql5-kg"
version = "1.0.0"
description = "MQL5 Knowledge Graph System - Build queryable knowledge graphs from MQL5 codebases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MQL5 KG Contributors"}
]
keywords = ["mql5", "knowledge-graph", "code-analysis", "mcp", "ai-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
graphify = "mql5_kg.cli.graphify:main"
mql5-kg = "mql5_kg.cli.graphify:main"

[project.urls]
Homepage = "https://github.com/avangardistic/MQL5-Knowledge-Graph-System"
Repository = "https://github.com/avangardistic/MQL5-Knowledge-Graph-System.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["mql5_kg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
